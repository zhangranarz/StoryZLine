<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoryZLine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>StoryZLine</h1>
    <div class="tabs" role="tablist" aria-label="StoryZLine">
      <button id="tab-api" class="tab" role="tab" type="button" aria-controls="panel-api" aria-selected="true">eComm</button>
      <button id="tab-settings" class="tab" role="tab" type="button" aria-controls="panel-settings" aria-selected="false" tabindex="-1">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
        </svg>
        <span>Settings</span>
      </button>
    </div>
  </header>

  <main>
    <section id="panel-api" class="panel" role="tabpanel" aria-labelledby="tab-api">
      <form id="form" class="card">
        <div id="login-summary" class="summary"></div>
        <label>
          <span>API</span>
          <input id="api" name="api" placeholder="/spl-banking/enq/customer/portfolio/12345" autocomplete="off">
        </label>
        <!-- Endpoint and APIController sections, built from #part-template -->
        <div id="sections"></div>
        <div class="actions">
          <button id="go" type="submit">Pull from Bitbucket</button>
          <span id="status" role="status"></span>
        </div>
      </form>

      <section id="result" hidden>
        <div class="card">
          <div class="card-title">Flow <span id="flow-state" class="state"></span></div>
          <div class="table-wrap">
            <table id="flow">
              <thead><tr><th>HTTP</th><th>Path</th><th>Match</th><th>Endpoint</th><th>API</th><th>Controller</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <p id="flow-note" class="note" hidden></p>
        </div>
        <!-- one code pane per pulled file, built from #pane-template -->
        <div id="panes"></div>
      </section>
    </section>

    <section id="panel-settings" class="panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <form id="conn" class="card">
        <div class="card-title">Bitbucket <span id="conn-state" class="state"></span></div>
        <div class="excel-bar">
          <div class="actions">
            <label class="file-button">
              <input id="pick-file" type="file" accept=".xlsx,.csv,.txt">
              <span title="Load an Excel list (.xlsx or .csv)">Load</span>
            </label>
            <button id="pick-template" type="button" title="Download a template list (.csv)">Download</button>
            <button id="pick-clear" type="button" title="Forget the loaded list" hidden>Forget</button>
            <span id="pick-state" class="state"></span>
            <span id="pick-status" role="status"></span>
          </div>
        </div>
        <div class="grid">
          <label class="wide">
            <span>URL</span>
            <select id="conn-url-select" hidden></select>
            <input id="conn-url" required placeholder="https://bitbucket.yourcompany.com" autocomplete="url">
          </label>
          <label>
            <span>User ID</span>
            <input id="conn-user" required autocomplete="username">
          </label>
          <label>
            <span>Password</span>
            <input id="conn-pass" type="password" required autocomplete="current-password" placeholder="Password or HTTP access token">
          </label>
        </div>
        <div class="actions">
          <button id="login" type="submit">Log in</button>
          <span id="conn-status" role="status"></span>
        </div>
      </form>
    </section>
  </main>

  <template id="part-template">
    <fieldset class="endpoint">
      <legend></legend>
      <div class="parts">
        <label>
          <span>URL</span>
          <input class="p-base" readonly tabindex="-1" placeholder="Set in Settings">
        </label>
        <label>
          <span>Project</span>
          <select class="p-project-select" hidden></select>
          <input class="p-project" placeholder="ECOM" autocomplete="off">
        </label>
        <label>
          <span>Repository</span>
          <select class="p-repo-select" hidden></select>
          <input class="p-repo" placeholder="ecomm-api" autocomplete="off">
        </label>
        <label>
          <span>Path</span>
          <input class="p-path" placeholder="src/main/java/…" autocomplete="off">
        </label>
        <!-- one File + Extension pair per file, from #file-template -->
      </div>
      <p class="p-msg note" hidden></p>
      <!-- one joined, editable file URL per file -->
      <div class="p-urls"></div>
    </fieldset>
  </template>

  <template id="file-template">
    <label>
      <span class="p-file-title">File</span>
      <input class="p-file" autocomplete="off">
    </label>
    <label>
      <span>Extension</span>
      <select class="p-ext-select"></select>
      <input class="p-ext" value=".java" placeholder=".ext" autocomplete="off" hidden>
    </label>
  </template>

  <template id="pane-template">
    <div class="card pane">
      <div class="pane-head">
        <div>
          <div class="file-name"><span class="pane-label"></span> · <span class="pane-file"></span></div>
          <div class="pane-where muted"></div>
        </div>
        <div class="buttons">
          <button class="pane-toggle" type="button" hidden>Show whole file</button>
          <a class="pane-open" target="_blank" rel="noopener">Open in Bitbucket</a>
          <button class="pane-copy" type="button">Copy</button>
        </div>
      </div>
      <p class="pane-msg note" hidden></p>
      <pre class="pane-code"></pre>
    </div>
  </template>

  <script src="shared/location.js"></script>
  <script src="shared/excel.js"></script>
  <script src="shared/java.js"></script>
  <script src="app.js"></script>
</body>
</html>
